name: clonapk
description: "Pembuat salinan (clone) APK dengan antarmuka bergaya iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Ikon khas Cupertino (chevron, search, share, dan sebagainya).
  cupertino_icons: ^1.0.9
  # Pemilih berkas untuk mengambil APK dari penyimpanan.
  file_picker: ^12.3.0
  # Membagikan APK hasil clone.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
